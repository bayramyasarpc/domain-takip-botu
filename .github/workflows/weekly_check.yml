name: Haftalık Domain Kontrolü

on:
  schedule:
    # Her Pazartesi sabah 09:00 TSI (06:00 UTC) çalışır
    - cron: '0 6 * * 1'
  workflow_dispatch: # İstediğiniz an elle çalıştırmanızı sağlar

jobs:
  check-domains:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests google-generativeai

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
